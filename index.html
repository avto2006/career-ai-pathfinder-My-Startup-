<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>კარიერის კომპასი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@500;600;700&family=Noto+Sans+Georgian:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1B2E;
    --ink-deep:#081120;
    --parchment:#EFE7D8;
    --parchment-dim:#E2D8C4;
    --brass:#C7972E;
    --brass-soft:#e0b658;
    --pine:#3F6657;
    --text-light:#F2EEE2;
    --text-dark:#1C2432;
    --line:rgba(242,238,226,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(199,151,46,0.08), transparent 55%),
      var(--ink);
    background-attachment:fixed;
    color:var(--text-light);
    font-family:'Noto Sans Georgian', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:56px 20px 80px;
    position:relative;
    overflow-x:hidden;
  }
  /* faint topographic contour lines in the background */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      repeating-radial-gradient(circle at 15% 20%, transparent 0 34px, var(--line) 35px, transparent 36px 68px),
      repeating-radial-gradient(circle at 85% 75%, transparent 0 42px, var(--line) 43px, transparent 44px 84px);
    opacity:0.5;
    pointer-events:none;
    z-index:0;
  }

  .page{ position:relative; z-index:1; max-width:660px; width:100%; }

  /* ---------- Signature: compass rose ---------- */
  .compass-wrap{ display:flex; justify-content:center; margin-bottom:18px; }
  .compass{ width:104px; height:104px; }
  .compass .dial{ fill:none; stroke:var(--line); stroke-width:1; }
  .compass .tick{ stroke:rgba(242,238,226,0.35); stroke-width:1; }
  .compass .tick.major{ stroke:var(--brass-soft); stroke-width:1.4; }
  .compass .needle{
    transform-origin:52px 52px;
    transition: transform 1.1s cubic-bezier(.34,1.5,.4,1);
  }
  .compass.spinning .needle{
    animation: spin 1.3s linear infinite;
    transition:none;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .compass .needle-n{ fill:var(--brass); }
  .compass .needle-s{ fill:rgba(242,238,226,0.55); }
  .compass .pivot{ fill:var(--text-light); }

  h1{
    font-family:'Noto Serif Georgian', serif;
    font-weight:600;
    font-size:clamp(28px, 5.5vw, 38px);
    text-align:center;
    letter-spacing:0.2px;
    color:var(--text-light);
  }
  .subtitle{
    text-align:center;
    color:rgba(242,238,226,0.62);
    font-size:14.5px;
    max-width:440px;
    margin:12px auto 40px;
    line-height:1.6;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass-soft);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .eyebrow::after{ content:""; flex:1; height:1px; background:var(--line); }

  /* ---------- Card ---------- */
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px;
    backdrop-filter:blur(2px);
  }
  label{
    display:block;
    font-weight:600;
    font-size:14.5px;
    margin-bottom:10px;
    color:var(--text-light);
  }
  textarea{
    width:100%;
    min-height:128px;
    padding:14px 15px;
    background:rgba(8,17,32,0.55);
    border:1px solid var(--line);
    border-radius:9px;
    color:var(--text-light);
    font-family:'Noto Sans Georgian', sans-serif;
    font-size:14.5px;
    line-height:1.6;
    resize:vertical;
    outline:none;
    transition:border-color .2s;
  }
  textarea::placeholder{ color:rgba(242,238,226,0.35); }
  textarea:focus{ border-color:var(--brass); }

  button{
    width:100%;
    margin-top:16px;
    background:var(--brass);
    color:var(--ink-deep);
    border:none;
    padding:15px;
    border-radius:9px;
    font-family:'Noto Sans Georgian', sans-serif;
    font-size:15.5px;
    font-weight:600;
    letter-spacing:0.2px;
    cursor:pointer;
    transition:background .2s, transform .1s;
  }
  button:hover{ background:var(--brass-soft); }
  button:active{ transform:scale(0.99); }
  button:disabled{ background:#5a5f68; color:rgba(242,238,226,0.6); cursor:not-allowed; }
  button:focus-visible, textarea:focus-visible{ outline:2px solid var(--brass-soft); outline-offset:2px; }

  .status{
    display:none;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:18px;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.05em;
    color:rgba(242,238,226,0.55);
  }
  .status.visible{ display:flex; }

  .error-box{
    display:none;
    margin-top:18px;
    padding:14px 16px;
    border:1px solid rgba(199,80,60,0.4);
    background:rgba(199,80,60,0.08);
    border-radius:9px;
    font-size:13.5px;
    color:#e6b0a4;
  }

  /* ---------- Result: route card ---------- */
  .result{
    display:none;
    margin-top:34px;
  }
  .summary{
    font-family:'Noto Sans Georgian', sans-serif;
    font-size:15px;
    line-height:1.75;
    color:var(--text-light);
    white-space:pre-line;
    padding-bottom:6px;
  }
  .route{
    position:relative;
    padding-left:34px;
  }
  .route::before{
    content:"";
    position:absolute;
    left:12px; top:6px; bottom:6px;
    width:1px;
    background:repeating-linear-gradient(to bottom, var(--brass-soft) 0 6px, transparent 6px 12px);
  }
  .waypoint{
    position:relative;
    background:var(--parchment);
    color:var(--text-dark);
    border-radius:11px;
    padding:18px 18px 16px;
    margin-bottom:16px;
    box-shadow:0 6px 18px rgba(0,0,0,0.28);
  }
  .waypoint::before{
    content: attr(data-n);
    position:absolute;
    left:-34px; top:18px;
    width:24px; height:24px;
    border-radius:50%;
    background:var(--ink);
    border:2px solid var(--brass);
    color:var(--brass-soft);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    display:flex; align-items:center; justify-content:center;
  }
  .wp-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    margin-bottom:8px;
  }
  .wp-title{
    font-family:'Noto Serif Georgian', serif;
    font-weight:600;
    font-size:17.5px;
  }
  .wp-match{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--pine);
    white-space:nowrap;
  }
  .wp-reason{ font-size:13.8px; line-height:1.6; color:#3a4356; margin-bottom:10px; }
  .wp-next{
    font-size:12.8px;
    color:var(--text-dark);
    background:var(--parchment-dim);
    border-left:3px solid var(--pine);
    padding:9px 11px;
    border-radius:6px;
    line-height:1.5;
  }
  .wp-next b{ color:var(--pine); }

  @media (prefers-reduced-motion: reduce){
    .compass.spinning .needle{ animation:none; }
    .compass .needle{ transition:none; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="compass-wrap">
    <svg class="compass" id="compass" viewBox="0 0 104 104">
      <circle class="dial" cx="52" cy="52" r="47"></circle>
      <circle class="dial" cx="52" cy="52" r="38"></circle>
      <g id="ticks"></g>
      <g class="needle" id="needle">
        <polygon class="needle-n" points="52,16 47,52 57,52"></polygon>
        <polygon class="needle-s" points="52,88 47,52 57,52"></polygon>
      </g>
      <circle class="pivot" cx="52" cy="52" r="4"></circle>
    </svg>
  </div>

  <h1>კარიერის კომპასი</h1>
  <p class="subtitle">აღწერე შენი უნარები და გამოცდილება — კომპასი მიგნებს იმ მიმართულებებს, სადაც ისინი ყველაზე მეტად გამოგადგება</p>

  <div class="eyebrow">უნარები</div>
  <div class="card">
    <label for="skills">რას იცი და რა გამოცდილება გაქვს?</label>
    <textarea id="skills" placeholder="მაგ: ვიცი ინგლისური B2 დონეზე, Excel, ფოტოების დამუშავება, ვარ კომუნიკაბელური და მიყვარს ხალხთან ურთიერთობა..."></textarea>
    <button id="analyzeBtn" onclick="analyzeCareer()">გზის პოვნა 🧭</button>
    <div class="status" id="status">
      <span id="statusText">კომპასი ეძებს მიმართულებას...</span>
    </div>
    <div class="error-box" id="errorBox"></div>
  </div>

  <div class="result" id="result">
    <div class="summary" id="summary"></div>
    <div class="eyebrow">შენი მარშრუტი</div>
    <div class="route" id="route"></div>
  </div>

</div>

<script>
  // draw compass ticks
  (function(){
    const g = document.getElementById('ticks');
    for(let i=0;i<72;i++){
      const angle = (i/72)*360;
      const major = i % 18 === 0;
      const r1 = major ? 38 : 41;
      const r2 = 45;
      const rad = angle * Math.PI/180;
      const x1 = 52 + r1*Math.sin(rad), y1 = 52 - r1*Math.cos(rad);
      const x2 = 52 + r2*Math.sin(rad), y2 = 52 - r2*Math.cos(rad);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1);
      line.setAttribute('x2',x2); line.setAttribute('y2',y2);
      line.setAttribute('class', major ? 'tick major' : 'tick');
      g.appendChild(line);
    }
  })();

  const PROXY_URL = "https://karieriskompasi.avtobagaturia21.workers.dev";

  async function analyzeCareer(){
    const input = document.getElementById('skills').value.trim();
    const btn = document.getElementById('analyzeBtn');
    const status = document.getElementById('status');
    const errorBox = document.getElementById('errorBox');
    const result = document.getElementById('result');
    const summaryEl = document.getElementById('summary');
    const routeEl = document.getElementById('route');
    const routeLabel = routeEl.previousElementSibling; // "შენი მარშრუტი" ეყებროუ
    const compass = document.getElementById('compass');
    const needle = document.getElementById('needle');

    errorBox.style.display = 'none';
    result.style.display = 'none';
    routeEl.style.display = 'none';
    routeLabel.style.display = 'none';

    if(!input){
      errorBox.textContent = 'ჯერ დაწერე შენი უნარები, რომ კომპასმა გზა იპოვოს.';
      errorBox.style.display = 'block';
      return;
    }

    if(!PROXY_URL || PROXY_URL.includes('SHENI-DASATURI')){
      errorBox.textContent = 'PROXY_URL ჯერ არ არის კონფიგურირებული — იხილე groq-proxy-worker.js-ის ინსტრუქცია.';
      errorBox.style.display = 'block';
      return;
    }

    btn.disabled = true;
    status.classList.add('visible');
    compass.classList.add('spinning');

    try{
      const response = await fetch(PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ skills: input })
      });

      const data = await response.json();

      if(response.ok && data.choices && data.choices[0].message.content){
        const aiAnswer = data.choices[0].message.content;
        summaryEl.textContent = aiAnswer;
        result.style.display = 'block';

        // needle settles once an answer has arrived
        needle.style.transform = 'rotate(140deg)';
        result.scrollIntoView({ behavior:'smooth', block:'start' });
      } else {
        console.error("Proxy/Groq Error:", data);
        const errorMsg = data.error ? (data.error.message || data.error) : "უცნობი შეცდომა";
        errorBox.textContent = `❌ შეცდომა: ${errorMsg}`;
        errorBox.style.display = 'block';
      }
    }catch(err){
      console.error("Fetch Error:", err);
      errorBox.textContent = `❌ კავშირის შეცდომა: ${err.message}`;
      errorBox.style.display = 'block';
    }finally{
      btn.disabled = false;
      status.classList.remove('visible');
      compass.classList.remove('spinning');
    }
  }
</script>

</body>
</html>
